<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cards of Chaos Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one column "card table" — scoreboard, last round reveal, then your hand with a sticky action bar. */
:root{
  --bg:#e7ecf1; --surface:#ffffff; --raised:#f4f7fa; --ink:#16202b; --muted:#5a6878; --line:#cdd6df;
  --accent:#e0345a; --accent-ink:#ffffff;
  --R:#8b6744; --P:#2a66cf; --S:#d23d35;
  --inst:#6f44e6; --vic:#b97e00; --trap:#0d8f83;
  --good:#1d8a4e;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#18212c; --raised:#1f2a37; --ink:#e7edf4; --muted:#93a2b3; --line:#2c3846;
  --accent:#ff5c7f; --accent-ink:#14080c;
  --R:#c69c74; --P:#6fa3ff; --S:#ff6d64;
  --inst:#a787ff; --vic:#f1b42c; --trap:#2fd2bf; --good:#46c97f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#18212c; --raised:#1f2a37; --ink:#e7edf4; --muted:#93a2b3; --line:#2c3846;
  --accent:#ff5c7f; --accent-ink:#14080c;
  --R:#c69c74; --P:#6fa3ff; --S:#ff6d64;
  --inst:#a787ff; --vic:#f1b42c; --trap:#2fd2bf; --good:#46c97f; color-scheme:dark}
*{box-sizing:border-box}
html{color-scheme:light}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:880px;margin:0 auto;padding-block:18px 0;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
.brand{font-family:var(--display);font-weight:400;font-size:clamp(26px,6vw,40px);line-height:1;letter-spacing:.01em}
.brand b{color:var(--accent);font-weight:400}
.topbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted)}
.chip strong{color:var(--ink)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;flex:1 1 160px}
input.code{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;flex:0 1 150px}
select{font:inherit;color:var(--ink);background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:5px 8px;max-width:100%}
.btn{font:inherit;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink);padding:10px 16px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:var(--S);font-weight:700}
.bigcode{font-family:var(--display);font-size:clamp(40px,12vw,64px);letter-spacing:.12em;line-height:1}

/* Scoreboard */
.seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.seat{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--raised);display:flex;flex-direction:column;gap:6px;min-width:0}
.seat.me{border-color:var(--ink)}
.seat.won{border-color:var(--good);box-shadow:0 0 0 2px var(--good) inset}
.seat-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.seat-name{font-weight:700;overflow-wrap:anywhere}
.status{font-size:12px;font-weight:700;white-space:nowrap}
.status.ok{color:var(--good)} .status.wait{color:var(--muted)}
.pts{display:flex;flex-wrap:wrap;gap:4px;min-height:24px}
.pt{display:inline-flex;align-items:center;gap:2px;border-radius:6px;padding:1px 6px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--surface)}
.pt.tR{background:var(--R)} .pt.tP{background:var(--P)} .pt.tS{background:var(--S)}
.pt.empty{background:none;color:var(--muted);font-weight:400;padding:1px 0}

/* Cards */
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:10px}
.card{font:inherit;color:var(--ink);text-align:left;cursor:pointer;position:relative;aspect-ratio:5/7;max-width:100%;
  border-radius:12px;border:2px solid var(--cc);background:color-mix(in srgb,var(--cc) 12%,var(--surface));
  padding:8px;display:flex;flex-direction:column;gap:2px;overflow:hidden;transition:transform .12s ease,box-shadow .12s ease}
.card:hover{transform:translateY(-2px)}
.card.on{transform:translateY(-6px);box-shadow:0 0 0 3px var(--accent),0 8px 18px color-mix(in srgb,var(--ink) 18%,transparent)}
.card.dc{opacity:.5;border-style:dashed}
.card.dc::after{content:"Descartar";position:absolute;inset:auto 6px 6px 6px;text-align:center;font-size:11px;font-weight:700;background:var(--ink);color:var(--surface);border-radius:6px;padding:2px}
.card.blocked{opacity:.4;cursor:not-allowed}
.card.tR{--cc:var(--R)} .card.tP{--cc:var(--P)} .card.tS{--cc:var(--S)}
.card.kinst{--cc:var(--inst)} .card.kvic{--cc:var(--vic)} .card.ktrap{--cc:var(--trap)}
.cv{font-family:var(--display);font-size:30px;line-height:1;color:var(--cc)}
.ci{font-size:34px;line-height:1;margin-top:auto;align-self:center}
.cn{font-size:12px;font-weight:700;text-align:center;color:var(--cc);margin-top:auto}
.tag{position:absolute;top:8px;right:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--S)}
.kind{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--cc)}
.ptitle{font-family:var(--display);font-size:16px;line-height:1.1;color:var(--cc);margin-top:4px;overflow-wrap:anywhere}
.pdesc{font-size:12px;line-height:1.3;margin-top:auto}

/* Reveal */
.reveal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rv{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--raised);min-width:0}
.rv.win{border-color:var(--good);box-shadow:0 0 0 2px var(--good) inset}
.mini{display:flex;align-items:center;gap:8px}
.mini .big{font-family:var(--display);font-size:24px;line-height:1}
.mini .big.tR{color:var(--R)} .mini .big.tP{color:var(--P)} .mini .big.tS{color:var(--S)}
.was{font-size:12px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;border:1px solid var(--cc);color:var(--cc)}
.pill.kinst{--cc:var(--inst)} .pill.kvic{--cc:var(--vic)} .pill.ktrap{--cc:var(--trap)}
.headline{font-family:var(--display);font-size:20px;line-height:1.15}
.log{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;color:var(--muted);font-size:13px}
.traps{border:1px dashed var(--trap);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.traps .label{color:var(--trap)}

/* Action bar */
.bar{position:sticky;bottom:0;z-index:5;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line)}
.bar-in{max-width:880px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.hint{font-size:13px;color:var(--muted);min-width:0;flex:1 1 200px}
.hint.warn{color:var(--S);font-weight:700}
.targets{display:flex;flex-direction:column;gap:6px}
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
details.rules summary{cursor:pointer;font-weight:700}
details.rules ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.banner{border-radius:14px;padding:18px;background:var(--good);color:var(--surface);display:flex;flex-direction:column;gap:10px}
.banner .headline{font-size:26px}
footer{padding-bottom:24px}
@media (prefers-reduced-motion: reduce){.card{transition:none}.card:hover,.card.on{transform:none}}

/* Round replay */
.arena{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(5px);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.arena-in{width:100%;max-width:760px;display:flex;flex-direction:column;gap:14px}
.arena-top{display:flex;justify-content:space-between;align-items:center}
.abanner{min-height:40px;text-align:center;font-family:var(--display);font-size:clamp(20px,5.5vw,32px);line-height:1.1;color:var(--accent);text-wrap:balance}
.abanner.kinst{color:var(--inst)} .abanner.ktrap{color:var(--trap)}
.lanes{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;align-items:start}
.lane{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.lane-name{position:relative;font-weight:700;font-size:13px;text-align:center;overflow-wrap:anywhere}
.slot{position:relative;width:100%;max-width:132px;aspect-ratio:5/7;perspective:700px}
.acard{position:absolute;inset:0;border-radius:12px;border:3px solid var(--cc,var(--line));background:color-mix(in srgb,var(--cc,var(--line)) 15%,var(--surface));
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 6px;box-shadow:0 6px 16px color-mix(in srgb,var(--ink) 16%,transparent)}
.acard.tR{--cc:var(--R)} .acard.tP{--cc:var(--P)} .acard.tS{--cc:var(--S)}
.acard.back{--cc:var(--accent);background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--accent) 24%,var(--surface)) 0 8px,var(--surface) 8px 16px)}
.acard.none{border-style:dashed;box-shadow:none;color:var(--muted);font-size:12px;justify-content:center;text-align:center}
.av{font-family:var(--display);font-size:clamp(24px,7vw,40px);line-height:1;color:var(--cc);display:inline-block;font-variant-numeric:tabular-nums}
.ai{font-size:clamp(24px,7vw,40px);line-height:1;display:inline-block}
.an{font-size:11px;font-weight:700;color:var(--cc)}
.acard.dim .ai{opacity:.25}
.acard.awin{box-shadow:0 0 0 4px var(--good),0 10px 28px color-mix(in srgb,var(--good) 45%,transparent)}
.acard.alose{filter:grayscale(.85);opacity:.55}
.achips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:22px}
.pill{background:var(--surface)}
.pill.fizzle{opacity:.35;text-decoration:line-through}
.pill.armed{background:var(--cc);color:var(--surface)}
.afloat{position:absolute;left:50%;top:12%;z-index:3;pointer-events:none;white-space:nowrap;font-family:var(--display);font-size:24px;
  text-shadow:0 2px 0 var(--surface),0 -2px 0 var(--surface),2px 0 0 var(--surface),-2px 0 0 var(--surface)}
.afloat.up{color:var(--good)} .afloat.down{color:var(--S)} .afloat.neutral{color:var(--ink);font-size:17px} .afloat.trap{color:var(--trap);font-size:15px}
.aghost{position:fixed;margin:0;z-index:60;pointer-events:none}
.abanner.small{font-size:clamp(17px,4.5vw,24px);color:var(--ink)}
.tally{font-size:12px;font-weight:700;color:var(--muted);display:inline-block;font-variant-numeric:tabular-nums}
.lane{transition:opacity .15s}
.lane.afade{opacity:.28}
.tgtbtn{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.tgtbtn.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.capwarn{border:2px solid var(--S);color:var(--S);border-radius:10px;padding:8px 12px;font-weight:700}
</style>

</head>

let lang='es';

document.documentElement.lang=lang;
const T=()=>TXT[lang];
function t(k,...a){const v=T()[k];return typeof v==='function'?v(...a):v}
const msg=x=>Array.isArray(x)?t(...x):(x||'');

/* ------------------------------------------------------------------ data */
const ICON={R:'✊',P:'✋',S:'✌️'};
const BEATS={R:'S',S:'P',P:'R'};
const POW={
  plus:{k:'inst'},minus:{k:'inst',m:1},duelo:{k:'inst'},inv:{k:'inst'},swap:{k:'inst',m:1},
  remR:{k:'vic',tgt:1},remP:{k:'vic',tgt:1},remS:{k:'vic',tgt:1},disc:{k:'vic',tgt:1},
  noR:{k:'trap',m:1,blk:'R'},noP:{k:'trap',m:1,blk:'P'},noS:{k:'trap',m:1,blk:'S'},
  tRP:{k:'trap',tf:['R','P']},tPS:{k:'trap',tf:['P','S']},tSR:{k:'trap',tf:['S','R']},low:{k:'trap'}
};
const isRPS=c=>typeof c==='string'&&/^[RPS]\d{1,2}$/.test(c);
const ptitle=c=>T().pow[c][0];
const pdesc=(c,n)=>{const p=T().pow[c];return (n>=3&&p[2])?p[2]:p[1]};
const fmt=c=>isRPS(c)?ICON[c[0]]+c.slice(1):(POW[c]?ptitle(c):'?');
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cleanName(s){return String(s||'').replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁠-⁯﻿]/g,'').trim().slice(0,16)||'Player'}
function buildDeck(){const d=[];for(const t of 'RPS')for(let v=1;v<=10;v++){d.push(t+v,t+v)}return d.concat(Object.keys(POW))}

/* ------------------------------------------------------------------ engine (host only); log lines are stored as keys so each player reads them in their own language */
function log(G,...e){G.log.push(e);if(G.log.length>30)G.log.shift()}
function logText(e){
  const L=T().L,[k,...a]=e;if(!L[k])return '';
  if(k==='rem')return L.rem(a[0],T().typesLow[a[1]],a[2]);
  if(k==='remNone')return L.remNone(a[0],T().typesLow[a[1]]);
  if(k==='trap')return L.trap((a[0]||[]).map(c=>POW[c]?ptitle(c):'?').join(', '));
  return L[k](...a);
}
function draw(G,s,n){for(let i=0;i<n;i++){if(!G.deck.length){if(!G.disc.length)break;G.deck=shuffle(G.disc);G.disc=[];log(G,'shuffle')}s.hand.push(G.deck.pop())}}
function fixNoRPS(G,s){if(!s.hand.some(isRPS)){G.disc.push(...s.hand);s.hand=[];draw(G,s,7);log(G,'noRPS',s.name)}}
function blockedFor(tr,seat){if(!tr||tr.o===seat)return null;const b=tr.c.find(c=>POW[c]&&POW[c].blk);return b?POW[b].blk:null}
const canPlay=(tr,seat,c)=>isRPS(c)&&c[0]!==blockedFor(tr,seat);
function hasSet(pts){const n={R:0,P:0,S:0};pts.forEach(c=>n[c[0]]++);return n.R>=3||n.P>=3||n.S>=3||(n.R&&n.P&&n.S)}

function cleanSub(G,i,sub){
  const s=G.seats[i],n=G.seats.length;let hand=s.hand.slice();
  const take=c=>{const k=hand.indexOf(c);if(k<0)return false;hand.splice(k,1);return true};
  const dc=[];
  for(const c of (Array.isArray(sub&&sub.dc)?sub.dc:[]))if(hand.length>8&&take(c))dc.push(c);
  while(hand.length>8)dc.push(hand.splice(rnd(hand.length),1)[0]);
  let pp=null;
  if(sub&&canPlay(G.traps,i,sub.pp)&&take(sub.pp))pp=sub.pp;
  else{const c=hand.find(c=>canPlay(G.traps,i,c));if(c){take(c);pp=c}}
  const pw=[];let blk=false;
  for(const c of (Array.isArray(sub&&sub.pw)?sub.pw:[]).slice(0,3)){
    if(!POW[c])continue;if(POW[c].blk){if(blk)continue;blk=true}
    if(take(c))pw.push(c);
  }
  const tg={};
  for(const c of pw)if(POW[c].tgt){
    let x=sub&&sub.tg?sub.tg[c]:undefined;
    if(!(Number.isInteger(x)&&x>=0&&x<n&&x!==i))x=n===2?1-i:[...Array(n).keys()].find(k=>k!==i);
    tg[c]=x;
  }
  s.hand=hand;G.disc.push(...dc);
  return {pp,pw,tg};
}

function botDecide(G,i){
  const s=G.seats[i],n=G.seats.length;const hand=s.hand.slice();const dc=[];
  while(hand.length>8)dc.push(hand.splice(rnd(hand.length),1)[0]);
  const ok=hand.filter(c=>canPlay(G.traps,i,c));
  const pows=hand.filter(c=>!isRPS(c));const pw=[];
  if(pows.length&&Math.random()<0.55)pw.push(pows[rnd(pows.length)]);
  if(pows.length>1&&Math.random()<0.2){const c=pows.find(c=>!pw.includes(c));if(c&&!(POW[c].blk&&pw.some(x=>POW[x].blk)))pw.push(c)}
  const tg={};const rivals=[...Array(n).keys()].filter(k=>k!==i);
  pw.forEach(c=>{if(POW[c].tgt)tg[c]=rivals[rnd(rivals.length)]});
  return {pp:ok.length?ok[rnd(ok.length)]:null,pw,tg,dc};
}

function resolve(G,subs){
  const n=G.seats.length,multi=n>=3;
  const P=G.seats.map((s,i)=>cleanSub(G,i,subs[i]));
  const TR=G.traps?G.traps.c:[];
  const tf={};TR.forEach(c=>{if(POW[c].tf)tf[POW[c].tf[0]]=POW[c].tf[1]});
  const low=TR.includes('low');
  let cards=P.map(p=>p.pp?{code:p.pp,t:p.pp[0],v:+p.pp.slice(1)}:null);
  const steps=[];
  if(Object.keys(tf).length)steps.push({k:'tf',m:tf});
  if(low)steps.push({k:'low'});
  // Swap: only the RPS cards move, power cards stay with their owner
  const swaps=P.reduce((a,p)=>a+p.pw.filter(c=>c==='swap').length,0);
  const act=cards.map((c,i)=>c?i:-1).filter(i=>i>=0);
  if(swaps&&act.length>=2){
    const k=multi?swaps%act.length:swaps%2;
    if(k){const old=act.map(i=>cards[i]);const perm={};act.forEach((seat,j)=>{const src=(j-k+act.length*8)%act.length;cards[seat]=old[src];perm[seat]=act[src]});steps.push({k:'swap',p:perm})}
  }
  cards.forEach(c=>{if(c){c.f=tf[c.t]||c.t;c.fv=c.v}});
  P.forEach((p,i)=>{
    p.pw.forEach(c=>{
      if(c==='plus'&&cards[i]){cards[i].fv+=3;steps.push({k:'mod',by:i,c,to:[i],d:3})}
      if(c==='minus'){const to=[];cards.forEach((x,j)=>{if(x&&j!==i){x.fv-=3;to.push(j)}});if(to.length)steps.push({k:'mod',by:i,c,to,d:-3})}
    });
  });
  const duelo=P.some(p=>p.pw.includes('duelo'));
  const invN=P.reduce((a,p)=>a+p.pw.filter(c=>c==='inv').length,0),inv=invN%2===1;
  if(duelo)steps.push({k:'rule',c:'duelo'});
  if(invN)steps.push({k:'rule',c:'inv',on:inv?1:0});
  const better=(a,b)=>low?a.fv<b.fv:a.fv>b.fv;
  const beats=(a,b)=>{
    if(duelo||a.f===b.f)return better(a,b);
    return inv?BEATS[b.f]===a.f:BEATS[a.f]===b.f;
  };
  const counts=cards.map((a,i)=>a?cards.reduce((s,b,j)=>s+(b&&j!==i&&beats(a,b)?1:0),0):-1);
  const bw=cards.map((a,i)=>a?cards.map((b,j)=>b&&j!==i&&beats(a,b)?j:-1).filter(j=>j>=0):null);
  let w=null,tb=null;
  if(act.length){
    const max=Math.max(...counts);
    let cand=counts.map((c,i)=>c===max?i:-1).filter(i=>i>=0);
    if(cand.length>1){tb=max;
      const best=cand.reduce((b,i)=>b==null||better(cards[i],cards[b])?i:b,null);
      cand=cand.filter(i=>cards[i].fv===cards[best].fv);
    }
    if(cand.length===1)w=cand[0];
  }
  steps.push({k:'cmp',w,b:counts,bw,tb});
  const L={r:G.round,w,steps,flags:{duelo:duelo?1:0,inv:inv?1:0,low:low?1:0,swap:swaps?1:0,tf:Object.keys(tf).map(k=>k+tf[k])},
    items:G.seats.map((s,i)=>({pp:P[i].pp,held:cards[i]?cards[i].code:null,f:cards[i]?cards[i].f:null,v:cards[i]?cards[i].fv:null,pw:P[i].pw,b:counts[i],bw:bw[i]||[]}))};
  // discard everything except the winner's point and the winner's traps
  G.seats.forEach((s,i)=>{
    if(cards[i]&&i!==w)G.disc.push(cards[i].code);
    P[i].pw.forEach(c=>{if(i===w&&POW[c].k==='trap')return;G.disc.push(c)});
  });
  if(G.traps)G.disc.push(...G.traps.c);
  G.traps=null;
  G.last=L;
  if(w==null)log(G,'tie',G.round);
  else{const s=G.seats[w];s.pts.push(cards[w].code);log(G,'win',G.round,s.name,ICON[cards[w].f]+cards[w].fv)}
  const tcs=w!=null?P[w].pw.filter(c=>POW[c].tgt):[];
  G.pend={w,pw:w!=null?P[w].pw:[],tcs};
  if(w!=null&&tcs.length&&multi&&!G.seats[w].bot){G.phase='target';return}
  finishRound(G,{});
}
function autoTarget(G,w,c){
  const riv=G.seats.map((s,i)=>i).filter(i=>i!==w);
  if(c==='disc')return riv.reduce((b,i)=>G.seats[i].pts.length>G.seats[b].pts.length?i:b,riv[0]);
  const ty=c[3],has=riv.filter(i=>G.seats[i].pts.some(x=>x[0]===ty)),pool=has.length?has:riv;
  return pool[rnd(pool.length)];
}
function finishRound(G,tg){
  const {w,pw,tcs}=G.pend,n=G.seats.length,multi=n>=3,after=[];
  if(w!=null){
    const s=G.seats[w];
    tcs.forEach(c=>{
      let x=tg?tg[c]:undefined;
      if(!(Number.isInteger(x)&&x>=0&&x<n&&x!==w))x=autoTarget(G,w,c);
      const tgS=G.seats[x];
      if(c==='disc'){
        const k=Math.min(3,tgS.hand.length);
        for(let i=0;i<k;i++)G.disc.push(tgS.hand.splice(rnd(tgS.hand.length),1)[0]);
        log(G,'disc',tgS.name,k);after.push({k:'disc',by:w,tgt:x,n:k});
      }else{
        const ty=c[3],k=tgS.pts.findIndex(p=>p[0]===ty);
        if(k>=0){G.disc.push(tgS.pts.splice(k,1)[0]);log(G,'rem',s.name,ty,tgS.name)}
        else log(G,'remNone',tgS.name,ty);
        after.push({k:'rem',by:w,tgt:x,ty,ok:k>=0?1:0});
      }
    });
    const tr=pw.filter(c=>POW[c].k==='trap');
    if(tr.length){G.traps={o:w,c:tr};log(G,'trap',tr);after.push({k:'trapset',by:w,c:tr})}
  }
  G.last.after=after;
  G.seats.forEach((s,i)=>draw(G,s,w==null?2:i===w?1:(multi?2:3)));
  G.seats.forEach(s=>fixNoRPS(G,s));
  G.pend=null;
  if(w!=null&&hasSet(G.seats[w].pts)){G.phase='over';G.winner=w;log(G,'gameWin',G.seats[w].name)}
  else{G.phase='pick';G.round++}
}

/* ------------------------------------------------------------------ app state + network (PeerJS) */
const PREFIX='cardsofchaos-v1-';
let peer=null,conns={},hostConn=null;
let mode='home';            // home | host | guest
let G=null,view=null,guestCode='',hostGone=false,joinError='',status='';
let tsel={},tSent=false;
let sel={pp:null,pw:[],dc:[],tg:{}},mySub=null,hint='',hintWarn=false,lastKey='',subs={};
let myName='';
try{myName=localStorage.getItem('coc-name')||''}catch(e){}
const freshSel=()=>({pp:null,pw:[],dc:[],tg:{}});
const online=()=>typeof Peer!=='undefined';

function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=A[rnd(A.length)];return s}
function saveName(){const el=document.getElementById('name');if(!el)return;myName=cleanName(el.value);try{localStorage.setItem('coc-name',myName)}catch(e){}}
window.addEventListener('beforeunload',e=>{if(mode==='host'&&G&&!G.local&&G.seats.length>1){e.preventDefault();e.returnValue=''}});

/* ---- host: the host's browser runs the game and sends each player only their own hand */
function pub(forSeat){
  return {gid:G.gid||'',ph:G.phase,r:G.round||0,code:G.code,n:G.seats.length,you:forSeat,local:G.local?1:0,
    seats:G.seats.map((s,i)=>({id:s.id,n:s.name,b:s.bot?1:0,pts:s.pts||[],hc:(s.hand||[]).length,h:i===forSeat?(s.hand||[]):null,rd:G.ready&&G.ready[i]?1:0})),
    tr:G.traps||null,last:G.last||null,pend:G.phase==='target'&&G.pend?{w:G.pend.w,tcs:G.pend.tcs}:null,log:(G.log||[]).slice(-6),w:G.winner??null,dk:(G.deck||[]).length};
}
function publish(){
  view=pub(0);
  for(const id in conns){const c=conns[id];if(!c.open)continue;const i=G.seats.findIndex(s=>s.id===id);try{c.send({t:'state',v:pub(i)})}catch(e){}}
  render();
}
function hostCreate(local){
  saveName();mode='host';mySub=null;sel=freshSel();subs={};joinError='';G=null;
  if(local){G={phase:'lobby',code:'SOLO',local:true,seats:[{id:'host',name:myName,bot:false}],round:0,log:[]};publish();return}
  render();openHost(0);
}
function openHost(tries){
  const code=genCode();
  peer=new Peer(PREFIX+code.toLowerCase());
  peer.on('open',()=>{G={phase:'lobby',code,local:false,seats:[{id:'host',name:myName,bot:false}],round:0,log:[]};publish()});
  peer.on('error',err=>{
    if(err.type==='unavailable-id'&&tries<5&&!G){peer.destroy();openHost(tries+1);return}
    if(!G){mode='home';joinError=['createFail',err.type];render(true)}
    else console.warn('peer',err.type);
  });
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('connection',conn=>{
    conn.on('open',()=>{conns[conn.peer]=conn});
    conn.on('data',m=>onHostMsg(conn,m));
    conn.on('close',()=>{delete conns[conn.peer];delete subs[conn.peer];onLeave(conn.peer)});
  });
}
function onHostMsg(conn,m){
  if(!G||!m||typeof m!=='object')return;
  if(m.t==='hello'){
    const name=cleanName(m.name);
    if(G.phase==='lobby'){if(!G.seats.some(s=>s.id===conn.peer)&&G.seats.length<4)G.seats.push({id:conn.peer,name,bot:false})}
    else{const s=G.seats.find(s=>s.away&&s.name===name);if(s){s.id=conn.peer;s.bot=false;s.away=false;log(G,'back',s.name)}}
    hostTick();
  }else if(m.t==='sub'){subs[conn.peer]=m.sub;hostTick()}
  else if(m.t==='unsub'){delete subs[conn.peer];hostTick()}
  else if(m.t==='tg'&&G.phase==='target'&&G.pend&&G.seats[G.pend.w].id===conn.peer&&m.g===G.gid&&m.r===G.round){finishRound(G,m.tg||{});hostTick()}
}
function onLeave(id){
  if(!G)return;
  if(G.phase==='lobby')G.seats=G.seats.filter(s=>s.id!==id);
  else{const s=G.seats.find(s=>s.id===id&&!s.bot);if(s){s.bot=true;s.away=true;log(G,'away',s.name)}}
  hostTick();
}
function hostTick(){
  if(!G)return;
  if(G.phase==='target'&&G.pend&&G.seats[G.pend.w].bot)finishRound(G,{});
  if(G.phase==='pick')tryResolve();
  publish();
}
function tryResolve(){
  const list=[],rd=[];let all=true;
  G.seats.forEach((s,i)=>{
    let sub=null;
    if(s.bot)sub='BOT';
    else if(s.id==='host')sub=mySub;
    else sub=subs[s.id];
    if(sub!=='BOT'&&!(sub&&sub.g===G.gid&&sub.r===G.round))sub=null;
    rd[i]=!!sub;if(!sub)all=false;list[i]=sub;
  });
  G.ready=rd;
  if(!all)return;
  list.forEach((s,i)=>{if(s==='BOT')list[i]=botDecide(G,i)});
  resolve(G,list);G.ready=[];subs={};mySub=null;sel=freshSel();hint='';
}
function startGame(){
  Object.assign(G,{gid:Math.random().toString(36).slice(2,8),phase:'pick',round:1,deck:shuffle(buildDeck()),disc:[],traps:null,last:null,log:[],winner:null,ready:[]});

/* ---- guest */
function guestJoin(){
  saveName();
  const code=document.getElementById('code').value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
  if(code.length!==4){joinError=['codeLen'];render(true);return}
  joinError='';mode='guest';guestCode=code;view=null;hostGone=false;mySub=null;sel=freshSel();lastKey='';status=['connecting'];
  render();
  peer=new Peer();
  peer.on('open',()=>{
    hostConn=peer.connect(PREFIX+code.toLowerCase(),{reliable:true});
    hostConn.on('open',()=>{hostConn.send({t:'hello',name:myName});status=['waitHost'];render()});
    hostConn.on('data',m=>{
      if(!m||m.t!=='state'||!m.v)return;
      const v=m.v,key=v.gid+':'+v.r+':'+v.ph;
      if(key!==lastKey){lastKey=key;sel=freshSel();hint='';mySub=null;tsel={};tSent=false}
      view=v;hostGone=false;render();
    });
    hostConn.on('close',()=>{hostGone=true;render()});
  });
  peer.on('error',err=>{
    status=err.type==='peer-unavailable'?['noRoom']:['connErr',err.type];
    if(view)hostGone=true;render();
  });
}
function leave(){
  closeArena();animInit=false;animKey='';
  if(peer){try{peer.destroy()}catch(e){}}
  peer=null;conns={};hostConn=null;mode='home';G=null;view=null;mySub=null;sel=freshSel();subs={};joinError='';render(true);
}

/* ---- my actions */
function mySeat(){return view&&Number.isInteger(view.you)?view.you:-1}
function myHand(){const i=mySeat();return i>=0&&view.seats[i].h?view.seats[i].h:[]}
function setHint(k){hint=[k];hintWarn=true}
function tapCard(i){
  const hand=myHand();const c=hand[i];if(c==null||mySub||view.ph!=='pick')return;
  hint='';hintWarn=false;
  const excess=hand.length-8;
  if(sel.dc.includes(i)){sel.dc=sel.dc.filter(x=>x!==i);render();return}
  if(excess-sel.dc.length>0){
    if(sel.pp===i)sel.pp=null;sel.pw=sel.pw.filter(x=>x!==i);sel.dc.push(i);render();return;
  }
  if(isRPS(c)){
    if(!canPlay(view.tr,mySeat(),c))setHint('hBlocked');
    else sel.pp=sel.pp===i?null:i;
  }else if(sel.pw.includes(i)){sel.pw=sel.pw.filter(x=>x!==i);delete sel.tg[c]}
  else if(sel.pw.length>=3)setHint('hMax3');
  else if(POW[c].blk&&sel.pw.some(k=>POW[hand[k]].blk))setHint('hBlk1');
  else sel.pw.push(i);
  render();
}
function submit(){
  const hand=myHand();const n=view.n;const me=mySeat();
  const sub={g:view.gid,r:view.r,pp:sel.pp!=null?hand[sel.pp]:null,pw:sel.pw.map(i=>hand[i]),dc:sel.dc.map(i=>hand[i]),tg:{}};
  sub.pw.forEach(c=>{if(POW[c].tgt){const x=sel.tg[c];sub.tg[c]=Number.isInteger(x)?x:(n===2?1-me:[...Array(n).keys()].find(k=>k!==me))}});
  mySub=sub;hint='';
  if(mode==='host')hostTick();
  else{try{hostConn.send({t:'sub',sub})}catch(e){setHint('hSendFail');mySub=null}render()}
}
function submitTargets(){
  if(!view||view.ph!=='target'||!view.pend)return;
  const tg={...tsel};tSent=true;
  if(mode==='host'){finishRound(G,tg);tsel={};tSent=false;hostTick()}
  else{try{hostConn.send({t:'tg',g:view.gid,r:view.r,tg})}catch(e){tSent=false;setHint('hSendFail')}render()}
}
function unsubmit(){
  mySub=null;
  if(mode==='host')hostTick();else{try{hostConn.send({t:'unsub'})}catch(e){}render()}
}

let animKey='',animInit=false,arenaCtl=null;

function closeArena(){if(arenaCtl)arenaCtl.abort=true;arenaCtl=null;arena.hidden=true;arena.innerHTML=''}

     <div class="achips">${it.pw.map(c=>`<span class="pill k${POW[c].k}" data-c="${c}" style="opacity:0">${esc(ptitle(c))}</span>`).join('')}</div>
   </div>`).join('')}</div></div>`;
  arena.hidden=false;
  arena.querySelector('#skip').onclick=closeArena;
  const A=(el,kf,o)=>{try{return el.animate(kf,typeof o==='number'?{duration:o,easing:'ease-out'}:o).finished.catch(()=>{})}catch(e){return Promise.resolve()}};
  A(arena,[{opacity:0},{opacity:1}],160);
  const lanes=[...arena.querySelectorAll('.lane')];

  const cs=items.map((it,i)=>it.pp?{pt:it.pp[0],t:it.pp[0],v:+it.pp.slice(1),el:slot(i).querySelector('.acard')}:null);
  const paint=c=>{const e=c.el;e.className='acard t'+c.t+(c.dim?' dim':'')+(c.win?' awin':'')+(c.lose?' alose':'');e.querySelector('.av').textContent=c.v;e.querySelector('.ai').textContent=ICON[c.t];e.querySelector('.an').textContent=T().types[c.t]};
  const flipTo=async(c,fn)=>{await A(c.el,[{transform:'rotateY(0)'},{transform:'rotateY(90deg)'}],110);fn();paint(c);await A(c.el,[{transform:'rotateY(-90deg)'},{transform:'rotateY(0)'}],110)};
  const shake=el=>A(el,[{transform:'translateX(0)'},{transform:'translateX(-8px) rotate(-4deg)'},{transform:'translateX(8px) rotate(4deg)'},{transform:'translateX(-4px) rotate(-2deg)'},{transform:'translateX(0)'}],280);
  const pop=el=>A(el,[{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:240,easing:'cubic-bezier(.3,1.6,.5,1)'});
  const float=(host,text,cls)=>{const f=document.createElement('span');f.className='afloat '+(cls||'');f.textContent=text;host.appendChild(f);
    A(f,[{transform:'translate(-50%,0) scale(.5)',opacity:0},{transform:'translate(-50%,-24px) scale(1.2)',opacity:1,offset:.25},{transform:'translate(-50%,-34px) scale(1)',opacity:1,offset:.7},{transform:'translate(-50%,-64px) scale(.9)',opacity:0}],1000).then(()=>f.remove())};
  const banner=async(text,cls)=>{const b=arena.querySelector('#abanner');if(!b)return;b.className='abanner '+(cls||'');b.textContent=text;await A(b,[{transform:'scale(.3) rotate(-6deg)',opacity:0},{transform:'scale(1.15) rotate(2deg)',opacity:1,offset:.6},{transform:'scale(1)',opacity:1}],280)};
  const fly=async(from,to)=>{const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();const g=from.cloneNode(true);g.classList.add('aghost');g.style.left=a.left+'px';g.style.top=a.top+'px';g.style.opacity=1;arena.appendChild(g);

  const swapAnim=perm=>{
    const old=cs.slice(),first=old.map(c=>c&&c.el.getBoundingClientRect());
    for(const d in perm){const c=old[perm[d]];slot(+d).appendChild(c.el);cs[+d]=c}
    for(const d in perm){const s=perm[d],el=old[s].el,a=first[s],b=el.getBoundingClientRect(),dx=a.left-b.left,dy=a.top-b.top;
      A(el,[{transform:`translate(${dx}px,${dy}px)`},{transform:`translate(${dx/2}px,${dy/2-60}px) scale(1.15) rotate(10deg)`},{transform:'translate(0,0)'}],{duration:500,easing:'ease-in-out'})}
  };

  let run;
  if(part==='after'){
    // aftermath only: the clash already played; show the final table, then the effects
    cs.forEach((c,i)=>{if(!c)return;c.t=items[i].f;c.v=items[i].v;c.win=i===L.w;c.lose=L.w!=null&&i!==L.w;paint(c)});
    items.forEach((it,i)=>it.pw.forEach(c=>{const ch=chip(i,c);if(ch){ch.style.opacity=1;if(i!==L.w&&POW[c].k!=='inst')ch.classList.add('fizzle')}}));
    if(n>=3)lanes.forEach((ln,i)=>{const tl=ln.querySelector('.tally');if(tl)tl.textContent=t('beats',(items[i].bw||[]).length)});
    run=L.after||[];
    await sp(U);
  }else{
    // reveal: cards flip one by one, then the power-ups pop in under each card
    await sp(160);if(gone())return;
    for(const c of cs){if(!c)continue;await flipTo(c,()=>{});if(gone())return}
    for(const [i,it] of items.entries())for(const c of it.pw){const ch=chip(i,c);if(!ch)continue;ch.style.opacity=1;A(ch,[{transform:'translateY(16px) scale(.4)',opacity:0},{transform:'translateY(0) scale(1)',opacity:1}],{duration:240,easing:'cubic-bezier(.3,1.6,.5,1)'});await sp(80);if(gone())return}
    await sp(U);
    run=L.steps.concat(L.after||[]);
  }
  for(const st of run){
    if(gone())return;
    if(st.k==='tf'){
      for(const from in st.m){
        await banner(`${t('trapWord')}: ${ICON[from]} → ${ICON[st.m[from]]}`,'ktrap');
        for(const c of cs)if(c&&c.pt===from){shake(c.el);await flipTo(c,()=>{c.t=st.m[from]})}
        await sp(U*.7);if(gone())return;
      }
    }else if(st.k==='low'){await banner(T().flags.low,'ktrap');await sp(U)}
    else if(st.k==='swap'){await banner(T().flags.swap,'kinst');swapAnim(st.p);await sp(U*1.6)}
    else if(st.k==='mod'){
      const src=chip(st.by,st.c);if(src)pop(src);
      for(const j of st.to){
        const c=cs[j];if(!c)continue;
        if(src)await fly(src,c.el);if(gone())return;
        if(st.d>0)pop(c.el);else shake(c.el);
        float(slot(j),(st.d>0?'+':'−')+Math.abs(st.d),st.d>0?'up':'down');
        await tick(c,st.d);
      }
      await sp(U*.5);
    }else if(st.k==='rule'){
      if(st.c==='duelo'){await banner(`${T().flags.duelo} · ${t('animDuel')}`,'kinst');cs.forEach(c=>{if(c){c.dim=true;paint(c);pop(c.el.querySelector('.av'))}})}
      else{await banner(st.on?T().flags.inv:t('animInvCancel'),'kinst');if(st.on)cs.forEach(c=>{if(c)A(c.el.querySelector('.ai'),[{transform:'rotate(0)'},{transform:'rotate(540deg)'}],500)})}
      await sp(U);
    }else if(st.k==='cmp'){
      const act=cs.filter(Boolean);
      await Promise.all(act.map(c=>A(c.el,[{transform:'translateY(0) scale(1)'},{transform:'translateY(-22px) scale(1.08)'}],{duration:200,easing:'ease-out'})));
      await Promise.all(act.map(c=>A(c.el,[{transform:'translateY(-22px) scale(1.08)'},{transform:'translateY(8px) scale(.95)'},{transform:'translateY(0) scale(1)'}],{duration:170,easing:'ease-in'})));
      if(gone())return;
      // every matchup, one at a time: the winner of the pair lunges, the loser shakes, and the reason is shown
      const ids=cs.map((c,i)=>c?i:-1).filter(i=>i>=0),cnt=cs.map(()=>0),pairs=[];
      for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++)pairs.push([ids[a],ids[b]]);
      const pd=pairs.length>3?380:560;
      for(const [i,j] of pairs){
        if(gone())return;
        if(n>=3)lanes.forEach((ln,k)=>ln.classList.toggle('afade',k!==i&&k!==j));
        const iw=(st.bw[i]||[]).includes(j),jw=(st.bw[j]||[]).includes(i);
        if(iw||jw){
          const a=iw?i:j,b=iw?j:i,ca=cs[a],cb=cs[b];
          const byNum=L.flags.duelo||ca.t===cb.t;
          banner(byNum?`${ICON[ca.t]}${ca.v} ${L.flags.low?'<':'>'} ${ICON[cb.t]}${cb.v}`:`${ICON[ca.t]} ${t('beatsWord')} ${ICON[cb.t]}${L.flags.inv?' ('+t('reversedTag')+')':''}`,'small');
          const ra=ca.el.getBoundingClientRect(),rb=cb.el.getBoundingClientRect(),dx=Math.sign(rb.left-ra.left)*22;
          A(ca.el,[{transform:'translateX(0) scale(1)'},{transform:`translateX(${dx}px) scale(1.1)`},{transform:'translateX(0) scale(1)'}],{duration:260,easing:'ease-out'});
          setTimeout(()=>shake(cb.el),130);
          cnt[a]++;
          const tl=lanes[a].querySelector('.tally');if(tl){tl.textContent=t('beats',cnt[a]);pop(tl)}
        }else{banner('=','small');shake(cs[i].el);shake(cs[j].el)}
        await sp(pd);
      }
      lanes.forEach(ln=>ln.classList.remove('afade'));
      if(gone())return;
      if(n>=3&&st.tb!=null){await banner(t('animTieBreak',st.tb,!!L.flags.low),'');await sp(U*1.4);if(gone())return}
      if(st.w==null){
        await banner(t('animTie'),'');act.forEach(c=>shake(c.el));
        lanes.forEach(ln=>ln.querySelectorAll('.achips .kvic,.achips .ktrap').forEach(ch=>ch.classList.add('fizzle')));
      }else{
        cs.forEach((c,i)=>{
          if(!c)return;
          if(i===st.w){c.win=true;paint(c);A(c.el,[{transform:'scale(1)'},{transform:'scale(1.25) rotate(-5deg)'},{transform:'scale(1.1) rotate(3deg)'},{transform:'scale(1)'}],{duration:480,easing:'cubic-bezier(.3,1.6,.5,1)'});float(slot(i),t('animWin'),'up')}
          else shake(c.el).then(()=>{c.lose=true;paint(c)});
        });
        lanes.forEach((ln,i)=>{if(i!==st.w)ln.querySelectorAll('.achips .kvic,.achips .ktrap').forEach(ch=>ch.classList.add('fizzle'))});
      }
      await sp(U*1.8);
    }else if(st.k==='rem'||st.k==='disc'){
      const src=chip(st.by,st.k==='disc'?'disc':'rem'+st.ty);
      if(src){pop(src);await fly(src,nameEl(st.tgt))}if(gone())return;
      shake(lanes[st.tgt]);
      float(nameEl(st.tgt),st.k==='disc'?t('animCards',st.n):st.ok?`−1 ${ICON[st.ty]}`:t('noPts'),'down');
      await sp(U*1.3);
    }else if(st.k==='trapset'){
      for(const c of st.c){const ch=chip(st.by,c);if(ch){ch.classList.add('armed');pop(ch)}}
      float(nameEl(st.by),t('animTrap'),'trap');
      await sp(U*1.2);
    }
  }
  await sp(U*2.4);if(gone())return;
  await A(arena,[{opacity:1},{opacity:0}],220);
  if(arenaCtl===ctl)closeArena();
}

/* ------------------------------------------------------------------ events */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;
  if(a==='lang'){
    lang=lang==='es'?'en':'es';document.documentElement.lang=lang;
    try{localStorage.setItem('coc-lang',lang)}catch(e){}
    const codeEl=document.getElementById('code');saveName();
    render(true,codeEl?codeEl.value:'');
  }
  else if(a==='create')hostCreate(false);
  else if(a==='solo')hostCreate(true);
  else if(a==='join')guestJoin();
  else if(a==='leave')leave();
  else if(a==='addbot'){const k=G.seats.filter(s=>s.bot).length+1;G.seats.push({id:'bot'+Date.now(),name:'Bot '+k,bot:true});hostTick()}
  else if(a==='rmbot'){G.seats.splice(+b.dataset.i,1);hostTick()}
  else if(a==='start'||a==='rematch')startGame();
  else if(a==='tolobby'){G.phase='lobby';G.seats=G.seats.filter(s=>!s.away);G.last=null;G.traps=null;G.winner=null;hostTick()}
  else if(a==='card')tapCard(+b.dataset.i);
  else if(a==='submit')submit();
  else if(a==='unsubmit')unsubmit();
  else if(a==='tgpick'){tsel[b.dataset.c]=+b.dataset.i;render()}
  else if(a==='tgconfirm')submitTargets();
});
app.addEventListener('change',e=>{const s=e.target.closest('[data-act=tg]');if(s){sel.tg[s.dataset.c]=+s.value}});
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='code')guestJoin();
  if(e.target.id==='name')saveName();
});
render(true);
</script>
